<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Subscription - Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Music Subscription App</h1>

        <div class="form-box">

            <h2>Register</h2>

            <input type="email" id="registerEmail" placeholder="Enter Email">

            <input type="text" id="registerUsername" placeholder="Enter Username">

            <input type="password" id="registerPassword" placeholder="Enter Password">

            <button onclick="registerUser()">Register</button>

            <p id="registerMessage"></p>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
